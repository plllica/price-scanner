<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이거 진짜 최저가 맞아? - 마트 가격표 비교</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-badge">🛒 마트 득템 방지 위원회</div>
            <h1>가격표 찰칵, 최저가 비교</h1>
            <p>사진을 분석하고 있어요. 틀린 부분은 바로 수정할 수 있어요!</p>
        </header>

        <main class="app-main">
            <!-- 초기 업로드 영역 (label을 이용해 모바일 차단 우회) -->
            <div class="upload-section" id="uploadBox">
                <!-- 실제 파일 인풋 -->
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleFileSelected(event)">

                <div class="upload-placeholder" id="uploadPlaceholder">
                    <div class="camera-icon-box">📸</div>
                    <p><strong>가격표 사진을 등록해주세요</strong></p>
                    <span class="sub-text">상품명, 가격, 용량이 잘 보이게 찍어주세요</span>
                    
                    <div class="upload-btn-group">
                        <!-- label을 누르면 브라우저가 즉시 파일창을 엽니다 -->
                        <label for="imageInput" class="sub-action-btn">사진 촬영 / 갤러리 선택</label>
                    </div>
                </div>
            </div>

            <!-- 로딩 상태 -->
            <div class="loading-container" id="loadingSpinner" style="display: none;">
                <div class="toss-spinner"></div>
                <p id="loadingText">AI가 가격표를 정밀 분석 중입니다...</p>
            </div>

            <!-- 사진 + 수정 폼 듀얼 뷰 -->
            <div class="dual-view-container" id="dualViewContainer" style="display: none;">
                <div class="mini-preview-card">
                    <img id="imagePreview" alt="가격표 사진">
                    <button class="re-upload-btn-small" onclick="resetUpload()">사진 다시 선택</button>
                </div>

                <div class="card recognition-card">
                    <h3>⚡ 스캔 결과 확인 및 수정</h3>
                    <p class="guide-text">사진과 비교해서 틀린 내용이 있다면 탭해서 바로 고치세요!</p>
                    <div class="input-grid">
                        <div class="input-row">
                            <label>상품명</label>
                            <input type="text" id="detectedName" placeholder="상품명">
                        </div>
                        <div class="input-row">
                            <label>규격/용량</label>
                            <input type="text" id="detectedCapacity" placeholder="용량 (예: 210g x 18)">
                        </div>
                        <div class="input-row highlight">
                            <label>매장 가격</label>
                            <input type="text" id="detectedPrice" placeholder="최종 판매가">
                        </div>
                    </div>
                    <button class="primary-btn" onclick="comparePrices()">인터넷 최저가 비교하기 🚀</button>
                </div>
            </div>

            <!-- 결과 출력 섹션 -->
            <div class="result-section" id="resultSection" style="display: none;">
                <div class="verdict-banner" id="verdictBanner">
                    <span id="verdictEmoji">🎉</span>
                    <div>
                        <h4 id="verdictTitle">인터넷이 더 저렴해요!</h4>
                        <p id="verdictDesc">지금 매장가보다 더 아낄 수 있어요.</p>
                    </div>
                </div>

                <div class="card summary-card">
                    <div class="summary-header">
                        <span id="resultProductName">상품명</span>
                        <span class="capacity-tag" id="resultCapacity">용량</span>
                    </div>
                    <div class="price-comparison-box">
                        <div class="p-box store">
                            <span class="label">🏪 마트 매장가</span>
                            <span class="value" id="storePriceVal">0원</span>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="p-box online-best">
                            <span class="label">🌐 인터넷 최저가</span>
                            <span class="value" id="lowestPriceVal">0원</span>
                        </div>
                    </div>
                </div>

                <div class="card mall-card">
                    <h3>🛒 주요 쇼핑몰 실시간 가격 & 링크</h3>
                    <ul id="mallList"></ul>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
